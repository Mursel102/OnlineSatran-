
<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Online Satranç</title>

<script src="https://cdn.socket.io/4.8.1/socket.io.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.12.1/chess.min.js"></script>

<style>
* { box-sizing: border-box; }

body {
    margin: 0;
    padding: 15px;
    min-height: 100vh;
    background: #111827;
    color: white;
    font-family: Arial, sans-serif;
    text-align: center;
}

.container { max-width: 950px; margin: auto; }

h1 { color: #facc15; }

.panel {
    background: #1f2937;
    padding: 22px;
    border-radius: 14px;
    max-width: 450px;
    margin: 20px auto;
}

input {
    width: 100%;
    padding: 13px;
    margin: 8px 0;
    border-radius: 8px;
    border: 1px solid #4b5563;
    background: #111827;
    color: white;
    font-size: 17px;
    text-align: center;
}

button {
    padding: 12px 17px;
    margin: 5px;
    border: none;
    border-radius: 8px;
    background: #eab308;
    color: #111827;
    font-weight: bold;
    cursor: pointer;
}

button:hover { background: #facc15; }

#gameScreen { display: none; }

.game-layout {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    align-items: flex-start;
    gap: 20px;
    margin-top: 20px;
}

.board {
    display: grid;
    grid-template-columns: repeat(8, 1fr);
    width: min(90vw, 520px);
    aspect-ratio: 1;
    border: 5px solid #374151;
}

.square {
    display: flex;
    justify-content: center;
    align-items: center;
    position: relative;
    font-size: clamp(24px, 7vw, 54px);
    cursor: pointer;
    user-select: none;
}

.light { background: #f0d9b5; }
.dark { background: #b58863; }
.selected { background: #eab308 !important; }

.white-piece {
    color: white;
    text-shadow: 1px 2px 2px #333;
}

.black-piece { color: #171717; }

.possible::after {
    content: "";
    position: absolute;
    width: 22%;
    height: 22%;
    border-radius: 50%;
    background: #166534;
    opacity: .7;
}

.capture::after {
    content: "";
    position: absolute;
    inset: 4px;
    border: 5px solid #166534;
    border-radius: 50%;
}

.side-panel {
    background: #1f2937;
    border-radius: 12px;
    padding: 18px;
    width: 250px;
    text-align: left;
}

.status {
    background: #1f2937;
    padding: 14px;
    border-radius: 8px;
    margin: 12px auto;
}

.room-code {
    color: #facc15;
    font-size: 25px;
    font-weight: bold;
    letter-spacing: 4px;
}

#moveList {
    max-height: 180px;
    overflow-y: auto;
    line-height: 1.8;
}

#connection {
    color: #facc15;
    font-size: 13px;
    margin-top: 10px;
}

@media(max-width: 600px) {
    .board { width: 95vw; }
    .side-panel { width: 95vw; }
}
</style>
</head>

<body>

<div class="container">

<h1>♟ ONLINE SATRANÇ</h1>
<p>Arkadaşınla internet üzerinden satranç oyna.</p>

<div id="menuScreen" class="panel">

    <h2>Oyun menüsü</h2>

    <button onclick="createRoom()">Oda oluştur</button>

    <hr>

    <h3>Odaya katıl</h3>

    <input id="roomInput" maxlength="6" placeholder="6 haneli oda kodu">

    <button onclick="joinGame()">Odaya katıl</button>

    <div id="connection">Bağlanılıyor...</div>

</div>

<div id="gameScreen">

    <div class="status" id="gameStatus">Oyun yükleniyor...</div>

    <div class="game-layout">

        <div>
            <div class="board" id="board"></div>
        </div>

        <div class="side-panel">

            <h3>Oyun bilgileri</h3>

            <p>Oda kodu:</p>
            <div class="room-code" id="roomCode">------</div>

            <button onclick="copyRoomCode()">Kodu kopyala</button>

            <hr>

            <p>Senin rengin:</p>
            <h3 id="myColor">-</h3>

            <p>Beyaz: <span id="whitePlayer">Bekleniyor</span></p>
            <p>Siyah: <span id="blackPlayer">Bekleniyor</span></p>

            <hr>

            <h3>Hamleler</h3>
            <div id="moveList">Henüz hamle yok.</div>

            <hr>

            <button onclick="backToMenu()">Menüye dön</button>

        </div>

    </div>

</div>

</div>

<script>

// KÜTÜPHANE KONTROLÜ

if (typeof Chess === "undefined") {
    document.getElementById("connection").textContent =
        "Satranç kütüphanesi yüklenemedi. Sayfayı yenile.";
    throw new Error("Chess.js yüklenemedi.");
}

if (typeof io === "undefined") {
    document.getElementById("connection").textContent =
        "Socket.IO kütüphanesi yüklenemedi.";
    throw new Error("Socket.IO yüklenemedi.");
}


// BAĞLANTI

const socket = io({
    reconnection: true,
    reconnectionAttempts: Infinity,
    reconnectionDelay: 1000
});

let playerId = localStorage.getItem("chess_player_id");

if (!playerId) {
    playerId = "player_" + Math.random().toString(36).slice(2) + Date.now();
    localStorage.setItem("chess_player_id", playerId);
}

let roomCode = localStorage.getItem("chess_room") || "";
let myColor = null;
let chess = new Chess();
let selectedSquare = null;
let possibleMoves = [];
let currentStatus = null;


// TAŞLAR

const pieces = {
    wK: "♔", wQ: "♕", wR: "♖",
    wB: "♗", wN: "♘", wP: "♙",
    bK: "♚", bQ: "♛", bR: "♜",
    bB: "♝", bN: "♞", bP: "♟"
};


// BAĞLANTI OLAYLARI

socket.on("connect", () => {
    document.getElementById("connection").textContent =
        "Sunucuya bağlandı.";

    if (roomCode) {
        socket.emit("rejoin_game", {
            code: roomCode,
            player_id: playerId
        });
    }
});

socket.on("disconnect", () => {
    document.getElementById("connection").textContent =
        "Bağlantı kesildi. Yeniden bağlanılıyor...";
});

socket.on("connect_error", error => {
    console.error(error);
    document.getElementById("connection").textContent =
        "Sunucu bağlantı hatası.";
});


// ODA OLUŞTUR

function createRoom() {
    if (!socket.connected) {
        alert("Sunucuya bağlanılmadı.");
        return;
    }

    socket.emit("create_room", {
        player_id: playerId
    });
}


// ODAYA KATIL

function joinGame() {
    if (!socket.connected) {
        alert("Sunucuya bağlanılmadı.");
        return;
    }

    const code = document.getElementById("roomInput")
        .value.trim().toUpperCase();

    if (code.length !== 6) {
        alert("6 haneli oda kodu gir.");
        return;
    }

    socket.emit("join_game", {
        code: code,
        player_id: playerId
    });
}


// ODA CEVAPLARI

socket.on("room_created", data => enterGame(data));
socket.on("room_joined", data => enterGame(data));

socket.on("error_message", message => {
    alert(message);
});

function enterGame(data) {
    roomCode = data.code;
    myColor = data.color;

    localStorage.setItem("chess_room", roomCode);

    document.getElementById("menuScreen").style.display = "none";
    document.getElementById("gameScreen").style.display = "block";

    document.getElementById("roomCode").textContent = roomCode;

    document.getElementById("myColor").textContent =
        myColor === "white" ? "Beyaz" : "Siyah";

    renderBoard();
}


// OYUN DURUMU

socket.on("game_state", data => {
    try {
        chess.load(data.fen);
    } catch (error) {
        console.error("FEN hatası:", error);
        return;
    }

    currentStatus = data.status;
    selectedSquare = null;
    possibleMoves = [];

    document.getElementById("gameStatus").textContent =
        data.status.text;

    document.getElementById("whitePlayer").textContent =
        data.players.white ? "Bağlandı" : "Bekleniyor";

    document.getElementById("blackPlayer").textContent =
        data.players.black ? "Bağlandı" : "Bekleniyor";

    updateMoveList(data.moves);
    renderBoard();
});

socket.on("player_disconnected", data => {
    alert(data.message);
});


// HAMLE LİSTESİ

function updateMoveList(moves) {
    const element = document.getElementById("moveList");

    if (!moves || moves.length === 0) {
        element.textContent = "Henüz hamle yok.";
        return;
    }

    let output = "";

    for (let i = 0; i < moves.length; i += 2) {
        output +=
            (Math.floor(i / 2) + 1) + ". " +
            moves[i] + " " +
            (moves[i + 1] || "") + "<br>";
    }

    element.innerHTML = output;
}


// TAHTAYI ÇİZ

function renderBoard() {
    const boardElement = document.getElementById("board");
    boardElement.innerHTML = "";

    const position = chess.board();

    for (let row = 0; row < 8; row++) {
        for (let col = 0; col < 8; col++) {

            let r = row;
            let c = col;

            if (myColor === "black") {
                r = 7 - row;
                c = 7 - col;
            }

            const squareName = "abcdefgh"[c] + (8 - r);
            const piece = position[r][c];

            const square = document.createElement("div");

            square.className =
                "square " +
                ((r + c) % 2 === 0 ? "light" : "dark");

            if (selectedSquare === squareName) {
                square.classList.add("selected");
            }

            const isPossible = possibleMoves.some(
                move => move.to === squareName
            );

            if (isPossible) {
                square.classList.add(piece ? "capture" : "possible");
            }

            if (piece) {
                const color = piece.color === "w" ? "w" : "b";
                square.textContent =
                    pieces[color + piece.type.toUpperCase()];

                square.classList.add(
                    piece.color === "w" ? "white-piece" : "black-piece"
                );
            }

            square.addEventListener("click", () => {
                clickSquare(squareName);
            });

            boardElement.appendChild(square);
        }
    }
}


// KARE SEÇİMİ

function clickSquare(square) {
    if (!roomCode || !myColor) return;
    if (currentStatus && currentStatus.finished) return;

    const myTurn =
        (myColor === "white" && chess.turn() === "w") ||
        (myColor === "black" && chess.turn() === "b");

    if (!myTurn) {
        document.getElementById("gameStatus").textContent =
            "Rakibin hamlesini bekle.";
        return;
    }

    const piece = chess.get(square);

    if (selectedSquare) {
        const selectedMove = possibleMoves.find(
            move => move.to === square
        );

        if (selectedMove) {
            sendMove(selectedMove);
            return;
        }
    }

    if (piece && piece.color === (myColor === "white" ? "w" : "b")) {
        selectedSquare = square;

        possibleMoves = chess.moves({
            square: square,
            verbose: true
        });

        renderBoard();
        return;
    }

    selectedSquare = null;
    possibleMoves = [];
    renderBoard();
}


// HAMLE GÖNDER

function sendMove(move) {
    let promotion = "";

    if (
        move.piece === "p" &&
        (move.to.endsWith("8") || move.to.endsWith("1"))
    ) {
        promotion = prompt(
            "Terfi taşı:\nq = Vezir\nr = Kale\nb = Fil\nn = At",
            "q"
        );

        if (!promotion) return;

        promotion = promotion.toLowerCase();

        if (!["q", "r", "b", "n"].includes(promotion)) {
            alert("Geçersiz taş seçimi.");
            return;
        }
    }

    const uci = move.from + move.to + promotion;

    socket.emit("make_move", {
        code: roomCode,
        player_id: playerId,
        uci: uci
    });

    selectedSquare = null;
    possibleMoves = [];
    renderBoard();
}


// KODU KOPYALA

function copyRoomCode() {
    if (!roomCode) return;

    if (navigator.clipboard && window.isSecureContext) {
        navigator.clipboard.writeText(roomCode)
            .then(() => alert("Oda kodu kopyalandı."))
            .catch(() => alert("Oda kodun: " + roomCode));
    } else {
        alert("Oda kodun: " + roomCode);
    }
}


// MENÜYE DÖN

function backToMenu() {
    if (!confirm("Menüye dönmek istiyor musun?")) return;

    localStorage.removeItem("chess_room");

    roomCode = "";
    myColor = null;
    selectedSquare = null;
    possibleMoves = [];
    currentStatus = null;
    chess = new Chess();

    document.getElementById("gameScreen").style.display = "none";
    document.getElementById("menuScreen").style.display = "block";
    document.getElementById("roomInput").value = "";
}

</script>

</body>
</html>
